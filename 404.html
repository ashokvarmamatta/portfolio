<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not found — Matta Ashok Varma</title>
<meta name="robots" content="noindex">
<!-- Self-contained on purpose: public/ is copied verbatim, so this page cannot
     reference the hashed stylesheet the built pages use. The tokens below are
     the same values from styles/tokens.css, inlined. -->
<style>
  :root{--surface:#141313;--on-surface:#e6e1e1;--on-surface-variant:#cbc5ca;
    --outline:#948f94;--primary:#cbc4cb;--r-full:999px}
  @media (prefers-color-scheme: light){
    :root{--surface:#fdf8fd;--on-surface:#1d1b1e;--on-surface-variant:#49454b;
      --outline:#7a757e;--primary:#615d63}
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark light}
  body{background:var(--surface);color:var(--on-surface);min-height:100vh;
    display:grid;place-items:center;padding:24px;line-height:1.6;
    font-family:"Roboto Flex",Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  main{max-width:46ch;text-align:center}
  .code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:13px;color:var(--outline);letter-spacing:.14em;margin-bottom:14px}
  h1{font-size:clamp(26px,5vw,36px);font-weight:500;letter-spacing:-.5px;line-height:1.15}
  p{color:var(--on-surface-variant);margin-top:12px;font-size:15px}
  a{display:inline-flex;align-items:center;height:40px;padding:0 24px;margin-top:26px;
    border:1px solid var(--outline);border-radius:var(--r-full);color:var(--primary);
    text-decoration:none;font-size:14px;font-weight:500}
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>That page is not here</h1>
  <p>It may have moved, or the link may be wrong. The work and the apps are both
    one click away.</p>
  <a href="/">Back to the portfolio</a>
</main>
</body>
</html>
